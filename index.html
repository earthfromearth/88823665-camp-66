<!DOCTYPE html>
<html>
    <head>
        <title>Workshop #HTML - FORM</title>
        <meta charset="UTF-8">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="mystyle.css">
    </head>

    <body>
    
        <form>
            <h1>Workshop #HTML - FORM</h1>
            <table>

                <tr>
                    <div class="mb-3">
                        <td>
                            <label for="fname" class="form-label">ชื่อ</label> 
                        </td>
                        <td>
                            <input type="text" class="form-control" id="exampleFormfname" placeholder="สมศักดิ์" required>
                        </td>
                    </div>
                
                </tr>
                
                <tr>
                    <div class="mb-3">
                        <td><label for="lname" class="form-label">สกุล</label> </td>
                        <td>
                            <input type="text" class="form-control" id="exampleFormlname" placeholder="อยากรวย" required>
                        </td>
                    </div>
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="dob" class="form-label">วัน/เดือน/ปีเกิด</label></td>
                    <td> 
                        <input type="date" class="form-control" id="dob" />
                        <br></td>
                    </div>
                    
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="age" class="form-label">อายุ</label>
</td>
                    <td> 
                        <input type="number" class="form-control" id="age" placeholder="อายุ" required>
                    </td>
                    </div>
                    
                </tr>
                
                <tr>
                    <div class="mb-3">
                        <td><label class="form-label d-block">เพศ</label></td>
                    <td>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="male" />
                            <label class="form-check-label" for="male">ชาย</label>
                          </div>
                          <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female" />
                            <label class="form-check-label" for="female">หญิง</label>
                          </div>
                    </td>
                    </div>
                    
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="photo" class="form-label">รูป</label></td>
                    <td>
                        <input class="form-control" type="file" id="photo" required><br>
                    </td>
                    </div>
                    
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="address" class="form-label">ที่อยู่</label></td>
                    <td><textarea class="form-control" id="address" rows="3" cols="50" required></textarea><br></td>
                    </div>
                    
                </tr>

                <tr>
                    <div class="mb-3">
                        <td><label for="color" class="form-label">สีที่ชอบ</label></td>
                    <td>
                        <input type="text" class="form-control" id="color" placeholder="สีที่ชอบ" />
                        <br>
                    </td>
                    </div>
                    
                </tr>

                <tr>
                    <div class="mb-3 ">
                        <td><label class="form-label d-block">แนวเพลงที่ชอบ</label></td>
                    <td><div class="form-check ">
                        <input class="form-check-input" type="radio" name="song" id="pop" value="pop" />
                        <label class="form-check-label" for="pop">เพื่อชีวิต</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="song" id="rock" value="rock" />
                        <label class="form-check-label" for="rock">ลูกทุ่ง</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="song" id="other" value="other" />
                        <label class="form-check-label" for="other">อื่นๆ</label>
                      </div><br>
                    </td>
                    </div>
                    
                </tr>

                <tr>
                    <div class="mb-3 form-check">
                        <td>
                            <input type="checkbox" class="form-check-input" id="consent" />
                            <label class="form-check-label" for="consent" aria-required="">ยินยอมให้เก็บข้อมูล</label>
                    <br></td>
                    </div>
                </tr>

                <tr>
                    <div class="d-flex justify-content-between">
                        <td>
                            <button type="reset" class="btn btn-secondary">Reset</button>
                    </td>
                    <td>
                        <button type="button" class="btn btn-outline-success">Submit</button>
                    </td>
                    </div>
                    
                </tr>


            </table>

        </form>
        <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
