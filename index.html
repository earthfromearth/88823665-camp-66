<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Kanit', sans-serif; /* ใช้ฟอนต์ Kanit */
        }
        .star {
            color: red; /* สีแดงสำหรับดอกจัน */
        }
    </style>

    </head>

    <body>
        <div class="container mt-5">
            
              <form>
                <div class="row mb-3">
                  <label for="name" class="col-sm-2 col-form-label">ชื่อ<span class="star">*</span></label>
                  <div class="col-sm-10">
                  <input type="text" class="form-control" id="name" placeholder="ชื่อ" required />
                </div>
                </div>
                <div class="row mb-3">
                    <label for="name" class="col-sm-2 col-form-label">สกุล<span class="star">*</span></label>
                    <div class="col-sm-10">
                    <input type="text" class="form-control" id="name" placeholder="สกุล" required />
                  </div>
                  </div>
                <div class="row mb-3"">
                  <label for="dob" class="col-sm-2 col-form-label">วัน/เดือน/ปีเกิด</label>
                  <div class="col-sm-10">
                    <input type="date" class="form-control" id="dob" placeholder="วัน/เดือน/ปีเกิด">
                </div>
                </div>
                <div class="row mb-3">
                    <label for="age" class="col-sm-2 col-form-label">อายุ</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="age" placeholder="อายุ">
                    </div>
                </div>    
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">เพศ</label>
                  <div class="col-sm-10">
                     <div class="form-check">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" />
                    <label class="form-check-label" for="male">ชาย</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="female" checked />
                    <label class="form-check-label" for="female">หญิง</label>
                  </div>
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="file" class="form-label">รูป</label>
                  <input class="form-control" type="file" id="file" />
                </div>
                <div class="mb-3">
                  <label for="color" class="form-label">สีที่ชอบ</label>
                  <select class="form-select" id="color">
                    <option selected>สีแดง</option>
                    <option>สีน้ำเงิน</option>
                    <option>สีเขียว</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">เพลงที่ชอบ</label>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="music" id="pop" value="pop" checked />
                    <label class="form-check-label" for="pop">เพื่อชีวิต</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="music" id="rock" value="rock" />
                    <label class="form-check-label" for="rock">ลูกทุ่ง</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="music" id="other" value="other" />
                    <label class="form-check-label" for="other">อื่นๆ</label>
                  </div>
                </div>
                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="consent" checked />
                  <label class="form-check-label" for="consent">ยินยอมให้เก็บข้อมูล</label>
                </div>
                <div class="d-flex gap-2">
                  <button type="reset" class="btn btn-secondary">Reset</button>
                  <button type="submit" class="btn btn-success">Submit</button>
                </div>
              </form>
            
          </div>
          
        <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
